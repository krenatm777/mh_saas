<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">Request received — MusharaqaHub</title><meta name="robots" content="noindex">
<link rel="icon" href="logo-icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<header class="site"><div class="shell nav"><a href="index.html" class="brand"><img class="mark" src="logo-icon.png" alt=""><span class="bn">Musharaqa<b>Hub</b></span></a>
<div class="nav-cta"><div class="lang-switch"><button type="button" data-lang="en" class="active" onclick="setLang('en')">EN</button><button type="button" data-lang="ru" onclick="setLang('ru')">RU</button><button type="button" data-lang="kz" onclick="setLang('kz')">KZ</button></div></div></div></header>
<div class="result-wrap">
<div class="result-ic ok">✓</div>
<h1 data-i18n="h1">Request received</h1>
<p class="muted" data-i18n="p">Thank you! Your request has been sent. A specialist will contact you within 1 business day to clarify the details and prepare an offer.</p>
<a href="index.html" class="btn btn-primary btn-lg" style="margin-top:8px" data-i18n="btn">← Back to site</a>
</div>
<script>
const RU={"title":"Заявка принята — MusharaqaHub","h1":"Заявка принята","p":"Спасибо! Ваша заявка отправлена. Специалист свяжется с вами в течение 1 рабочего дня для уточнения деталей и подготовки предложения.","btn":"← Вернуться на сайт"};
const KZ={"title": "Өтінім қабылданды — MusharaqaHub", "h1": "Өтінім қабылданды", "p": "Рақмет! Өтініміңіз жіберілді. Маман егжей-тегжейін нақтылау және ұсыныс дайындау үшін 1 жұмыс күні ішінде сізбен байланысады.", "btn": "← Сайтқа оралу"};
function setLang(l){document.documentElement.lang=l;document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(l!=='en'){if(el.getAttribute('data-en')===null)el.setAttribute('data-en',el.innerHTML);var _d=(l==='kz'?KZ:RU);if(_d&&_d[k]!=null)el.innerHTML=_d[k];else el.innerHTML=el.getAttribute('data-en');}else if(el.getAttribute('data-en')!==null){el.innerHTML=el.getAttribute('data-en');}});const t=document.querySelector('[data-i18n="title"]');if(t)document.title=t.textContent;document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.getAttribute('data-lang')===l));try{localStorage.setItem('lang',l)}catch(e){}}
try{var _s=localStorage.getItem('lang');if(_s==='ru'||_s==='kz')setLang(_s);}catch(e){}
</script></body></html>
